# Everything Polyglot needs. No Redis, no Postgres, no Nginx.
services:
  polyglot:
    image: qunqin45/polyglot:latest
    container_name: polyglot
    restart: unless-stopped
    ports:
      # Expose the WebUI on the server's network interfaces. If a reverse
      # proxy runs on this host, bind to 127.0.0.1:3000:3000 instead.
      - "3000:3000"
    volumes:
      - polyglot-data:/data
    # Timeouts, log retention, network rules, metrics and tracing are set in
    # the WebUI (Settings → Runtime), not here.
    environment:
      LOG_LEVEL: "info"

volumes:
  polyglot-data:
    name: polyglot-data
