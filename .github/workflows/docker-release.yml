name: Docker release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish multi-architecture image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve release channel and image name
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            channel="latest"
          elif [[ "${tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-preview\.[0-9]+$ ]]; then
            channel="preview-latest"
          else
            echo "Unsupported release tag: ${tag}" >&2
            echo "Use vX.Y.Z or vX.Y.Z-preview.N" >&2
            exit 1
          fi

          echo "git_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.release.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.git_tag }},priority=900
            type=raw,value=${{ steps.release.outputs.version }},priority=800
            type=raw,value=${{ steps.release.outputs.channel }},priority=700
          labels: |
            org.opencontainers.image.title=Polyglot
            org.opencontainers.image.description=Intelligent personal AI gateway and universal LLM API compatibility layer
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=polyglot-docker-release
          cache-to: type=gha,mode=max,scope=polyglot-docker-release
          provenance: mode=max
          sbom: true

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.git_tag }}"

      - name: Smoke test AMD64 image
        run: |
          docker run --rm --platform linux/amd64 \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.git_tag }}" version

      - name: Smoke test ARM64 image
        run: |
          docker run --rm --platform linux/arm64 \
            "${{ steps.release.outputs.image }}:${{ steps.release.outputs.git_tag }}" version
