# Everything Polyglot needs. No Redis, no Postgres, no Nginx.
services:
  polyglot:
    image: qunqin45/polyglot:latest
    container_name: polyglot
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - polyglot-data:/data
    environment:
      # Uncomment to change where request logs are pruned from.
      # LOG_RETENTION_DAYS: "30"
      # Refuse upstreams on private networks. Leave off if you proxy a local
      # Ollama or vLLM.
      # BLOCK_PRIVATE_UPSTREAM: "true"
      LOG_LEVEL: "info"

volumes:
  polyglot-data:
    name: polyglot-data
